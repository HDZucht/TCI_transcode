# TCI_transcode kit: settings, rules, and the msdr decoders that start with the kit.
# Generated by kit/make_decoder_config.py from msdr 1.0.0rc10. Edit the values and flip true/false freely; a rerun keeps
# them. Check the file with: python3 kit/check_config.py   (errors stop the kit, warnings do not)

[tci]
host          = "127.0.0.1"       # the receiver's TCI server
port          = 50001             # SDR Oxide: the station radio serves TCI here by default
vfo_offset_hz = 28000             # VFO distance from the IQ centre (SDR Oxide, RSP1A 2 MS/s, 433.92 MHz: 28 kHz)

[bridge]
listen  = "127.0.0.1:5454"  # where msdr connects (SDRconnect API)
iq_rate = 500000            # samples/s; the checker computes what each decoder that is on needs
spots   = true              # send decodes back to the receiver as TCI SPOT labels

[msdr]
port    = 8765              # msdr's web page
browser = true              # open msdr's page after the start

[rules]
# What kit/check_config.py enforces. Taken from msdr 1.0.0rc10, msdr/decoder/manager.py; [decoder_facts] holds the numbers.
one_session = "msdr runs one decoding session at a time, at one frequency: the receiver's VFO."
no_mix      = "ERROR: raw IQ decoders (path = IQ) and audio decoders cannot be on together."
one_mode    = "ERROR: audio decoders that are on together must share a receiver mode (modes in [decoder_facts]); set the receiver to that mode."
iq_rate     = "ERROR: bridge.iq_rate must reach the min_rate of every raw IQ decoder that is on."
iq_window   = "ERROR: a raw IQ decoder's signal must fit the IQ window: tci.vfo_offset_hz + width_hz/2 <= bridge.iq_rate/2."
names       = "ERROR: every key under [decoders] must be an msdr decoder id, and every value true or false."
programs    = "WARNING: a decoder whose program is not installed is skipped by msdr."
none_on     = "WARNING: no decoder is on; the kit starts the bridge and msdr only."

[decoders]
# Only decoders from one group can be on together (rules no_mix, one_mode). USB/LSB and USB/NFM
# decoders also fit the USB group, USB/NFM also the NFM group.

# ── raw IQ (15): bridge iq_rate at or above the rate shown, signal inside the IQ window ──
adsb           = false  # ADS-B / Mode S · built in · IQ ≥ 2.4 MS/s · 2.4 MHz wide
dsc            = false  # DSC · built in · IQ ≥ 9.6 kS/s · 3 kHz wide
endoftrain     = false  # End-of-Train · built in · IQ ≥ 48 kS/s · 12.5 kHz wide
ft8            = false  # FT8 · jt9 · IQ ≥ 48 kS/s · 3 kHz wide
ils            = false  # ILS · built in · IQ ≥ 48 kS/s · 15 kHz wide
lora           = false  # LoRa / Meshtastic / MeshCore · built in · IQ ≥ 250 kS/s · 250 kHz wide
orbcomm        = false  # Orbcomm satellite downlink · built in · IQ ≥ 57.6 kS/s · 25 kHz wide
rs41           = false  # RS41 radiosonde · built in · IQ ≥ 57.6 kS/s · 20 kHz wide
rtl433         = true   # ISM sensors (rtl_433) · rtl_433 · IQ ≥ 250 kS/s · 200 kHz wide
rtl433_wmbus   = false  # Wireless M-Bus (rtl_433) · rtl_433 · IQ ≥ 1 MS/s · 200 kHz wide
sonde_dfm      = false  # DFM-06/09/17 radiosonde · dfm09mod · IQ ≥ 48 kS/s · 20 kHz wide
sonde_m10      = false  # Meteomodem M10 radiosonde · m10mod · IQ ≥ 48 kS/s · 20 kHz wide
sonde_m20      = false  # Meteomodem M20 radiosonde · m20mod · IQ ≥ 48 kS/s · 20 kHz wide
sonde_rs92     = false  # Vaisala RS92 radiosonde · rs92mod · IQ ≥ 48 kS/s · 20 kHz wide
vor            = false  # VOR · built in · IQ ≥ 48 kS/s · 20 kHz wide

# ── audio, receiver in AM (6) ──
acars          = false  # ACARS (VHF 2400 bd MSK) · built in · audio 22.05 kS/s · 8 kHz wide
dcf77          = false  # DCF77 time code · built in · audio 11.025 kS/s · 1 kHz wide
