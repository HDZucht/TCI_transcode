# TCI_transcode kit: settings and the msdr decoders that start with the kit.
# Generated by kit/make_decoder_config.py from msdr 1.0.0rc10; flip true/false freely, a rerun keeps your flags.
#
# One session, one frequency: msdr decodes at the receiver's VFO. Decoders that are on together must come from the
# same group below: raw IQ decoders cannot run beside audio decoders, and an audio decoder hears what the receiver
# demodulates, so set the receiver to the group's mode (NFM, USB, AM ...). The kit refuses a mixed set and says why.

[tci]
host = "127.0.0.1"
port = 50001            # SDR Oxide: the station radio serves TCI here by default

[bridge]
listen = "127.0.0.1:5454"
iq_rate = 500000        # samples/s; rtl_433 needs 500000 behind SDR Oxide, ADS-B needs 2400000
spots = true            # send decodes back to the receiver as TCI SPOT labels

[msdr]
port = 8765
browser = true          # open msdr's page after the start

[decoders]

# ── raw IQ (15): need the bridge's iq_rate at or above the rate shown, and the signal inside the IQ window ──
adsb           = false  # ADS-B / Mode S · built in · IQ ≥ 2.4 MS/s · 2.4 MHz wide
dsc            = false  # DSC · built in · IQ ≥ 9.6 kS/s · 3 kHz wide
endoftrain     = false  # End-of-Train · built in · IQ ≥ 48 kS/s · 12.5 kHz wide
ft8            = false  # FT8 · jt9 · IQ ≥ 48 kS/s · 3 kHz wide
ils            = false  # ILS · built in · IQ ≥ 48 kS/s · 15 kHz wide
lora           = false  # LoRa / Meshtastic / MeshCore · built in · IQ ≥ 250 kS/s · 250 kHz wide
orbcomm        = false  # Orbcomm satellite downlink · built in · IQ ≥ 57.6 kS/s · 25 kHz wide
rs41           = false  # RS41 radiosonde · built in · IQ ≥ 57.6 kS/s · 20 kHz wide
rtl433         = true   # ISM sensors (rtl_433) · rtl_433 · IQ ≥ 250 kS/s · 200 kHz wide
rtl433_wmbus   = false  # Wireless M-Bus (rtl_433) · rtl_433 · IQ ≥ 1 MS/s · 200 kHz wide
sonde_dfm      = false  # DFM-06/09/17 radiosonde · dfm09mod · IQ ≥ 48 kS/s · 20 kHz wide
sonde_m10      = false  # Meteomodem M10 radiosonde · m10mod · IQ ≥ 48 kS/s · 20 kHz wide
sonde_m20      = false  # Meteomodem M20 radiosonde · m20mod · IQ ≥ 48 kS/s · 20 kHz wide
sonde_rs92     = false  # Vaisala RS92 radiosonde · rs92mod · IQ ≥ 48 kS/s · 20 kHz wide
vor            = false  # VOR · built in · IQ ≥ 48 kS/s · 20 kHz wide

# ── audio, receiver in AM (6) ──
acars          = false  # ACARS (VHF 2400 bd MSK) · built in · audio 22.05 kS/s · 8 kHz wide
dcf77          = false  # DCF77 time code · built in · audio 11.025 kS/s · 1 kHz wide
jjy            = false  # JJY time code · built in · audio 11.025 kS/s · 1 kHz wide
msf            = false  # MSF time code · built in · audio 11.025 kS/s · 1 kHz wide
wwv            = false  # WWV / WWVH time code · built in · audio 11.025 kS/s · 6 kHz wide
wwvb           = false  # WWVB time code · built in · audio 11.025 kS/s · 1 kHz wide

# ── audio, receiver in CW (1) ──
cw             = false  # CW · multimon-ng · audio 22.05 kS/s · 0.5 kHz wide

# ── NFM (15): msdr demodulates from the IQ when the signal lies inside the IQ window, otherwise it takes the receiver's audio in NFM ──
ais            = false  # AIS (GMSK 9600) · built in · audio 48 kS/s · 25 kHz wide
aprs           = false  # AX.25 packet 1200 (APRS) · multimon-ng · audio 22.05 kS/s · 12.5 kHz wide
dmr            = false  # DMR (dsd-fme) · dsd-fme · audio 48 kS/s · 12.5 kHz wide
dpmr           = false  # dPMR (dsd-fme) · dsd-fme · audio 48 kS/s · 12.5 kHz wide
dstar          = false  # D-STAR (dsd-fme) · dsd-fme · audio 48 kS/s · 12.5 kHz wide
dtmf           = false  # DTMF · multimon-ng · audio 22.05 kS/s · 12.5 kHz wide
eas            = false  # EAS · multimon-ng · audio 22.05 kS/s · 12.5 kHz wide
flex           = false  # FLEX · multimon-ng · audio 22.05 kS/s · 12.5 kHz wide
m17            = false  # M17 (dsd-fme) · dsd-fme · audio 48 kS/s · 12.5 kHz wide
nxdn           = false  # NXDN48 · 6.25 kHz (dsd-fme) · dsd-fme · audio 48 kS/s · 6.25 kHz wide
nxdn96         = false  # NXDN96 · 12.5 kHz (dsd-fme) · dsd-fme · audio 48 kS/s · 12.5 kHz wide
p25            = false  # P25 Phase 1 (dsd-fme) · dsd-fme · audio 48 kS/s · 12.5 kHz wide
packet9600     = false  # AX.25 packet 9600 (G3RUH) · multimon-ng · audio 22.05 kS/s · 20 kHz wide
pocsag         = false  # POCSAG · multimon-ng · audio 22.05 kS/s · 12.5 kHz wide
ysf            = false  # Yaesu System Fusion (YSF, dsd-fme) · dsd-fme · audio 48 kS/s · 12.5 kHz wide

# ── audio, receiver in USB (8) ──
ale            = false  # HF ALE (2G) · built in · audio 8 kS/s · 3 kHz wide
chu            = false  # CHU time code · built in · audio 11.025 kS/s · 3 kHz wide
freedv1600     = false  # FreeDV 1600 · freedv_rx · audio 8 kS/s · 2.5 kHz wide
freedv700d     = false  # FreeDV 700D · freedv_rx · audio 8 kS/s · 2.5 kHz wide
freedv700e     = false  # FreeDV 700E · freedv_rx · audio 8 kS/s · 2.5 kHz wide
navtex         = false  # NAVTEX (SITOR-B 100 Bd) · built in · audio 11.025 kS/s · 1 kHz wide
psk31          = false  # PSK31 · built in · audio 8 kS/s · 3 kHz wide
wefax          = false  # Radiofax (WEFAX 120/576) · built in · audio 11.025 kS/s · 3 kHz wide

# ── audio, receiver in USB/LSB (3) ──
packet300      = false  # AX.25 packet 300 (HF) · direwolf · audio 22.05 kS/s · 2.8 kHz wide
rtty           = false  # RTTY · built in · audio 11.025 kS/s · 2.8 kHz wide
rtty_minimodem = false  # RTTY (minimodem) · minimodem · audio 22.05 kS/s · 2.8 kHz wide

# ── audio, receiver in USB/NFM (1) ──
sstv           = false  # SSTV (Robot 36, Martin, Scottie, PD) · built in · audio 11.025 kS/s · 3 kHz wide
