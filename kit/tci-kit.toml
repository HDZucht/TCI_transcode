# ── audio, receiver in NFM (15): msdr demodulates from the IQ when the signal lies inside the IQ window, otherwise it takes the receiver's NFM audio ──
ais            = false  # AIS (GMSK 9600) · built in · audio 48 kS/s · 25 kHz wide
aprs           = false  # AX.25 packet 1200 (APRS) · multimon-ng · audio 22.05 kS/s · 12.5 kHz wide
